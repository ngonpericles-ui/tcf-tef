<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test GRAMMAR C2</title>
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    .container {
      width: 400px;
      height: 300px;
      background: linear-gradient(135deg, #8B5CF6 0%, #8B5CF6CC 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .category { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
    .level { font-size: 18px; opacity: 0.9; }
    .type { font-size: 14px; opacity: 0.8; position: absolute; top: 16px; left: 16px; }
    .pattern {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 50%);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pattern"></div>
    <div class="type">TEST</div>
    <div class="icon">📚</div>
    <div class="category">GRAMMAR</div>
    <div class="level">Level C2</div>
  </div>
</body>
</html>
